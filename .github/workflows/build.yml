name: build

# El instalador que se publica sale SIEMPRE de aca, nunca de una PC personal:
# el SHA-256 del log del build es lo que permite verificar que el binario
# publicado corresponde a este codigo.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  WIX_URL: https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
  WIX_SHA256: 6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Version (del tag; 0.0.0 fuera de un release)
        id: version
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $version = if ($ref -like 'refs/tags/v*') { $ref -replace '^refs/tags/v', '' } else { '0.0.0' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "version = $version"

      - name: WiX 3.14 (lo necesita jpackage para armar el instalador)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\wix.zip"
          Invoke-WebRequest -Uri $env:WIX_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne $env:WIX_SHA256) {
              throw "WiX no coincide con el hash esperado: $hash"
          }
          Expand-Archive $zip -DestinationPath C:\Tools\wix314 -Force

      - name: Compilar, testear y empaquetar
        shell: pwsh
        run: .\empaquetar.ps1 -Wix C:\Tools\wix314 -Version ${{ steps.version.outputs.version }}

      - name: Huella del instalador
        shell: pwsh
        run: Get-FileHash "dist\MyVetAgente-${{ steps.version.outputs.version }}.exe" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: dist/MyVetAgente-*.exe
          if-no-files-found: error

  publicar:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: instalador
          merge-multiple: true
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/**/*.exe
          generate_release_notes: true
